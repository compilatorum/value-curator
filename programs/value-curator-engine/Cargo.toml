[package]
name = "value-curator-engine"
version = "0.1.0"
description = "Value Curator Engine: Guarded Custody and Execution Program on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "value_curator_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "token_interface", "transfer_hook"] }
spl-transfer-hook-interface = "0.7.0"
spl-tlv-account-resolution = "0.7.1"
spl-type-length-value = "0.5.0"
spl-discriminator = "0.3.0"
solana-program = "1.18"
